---
# @var minio_image:description: Docker image to use
minio_image: webhippie/minio:latest

# @var minio_pull_image:description: Pull image as part of the tasks
minio_pull_image: true

# @var minio_network:description: Optional docker network to attach
minio_network:

# @var minio_default_publish:description: List of default port publishing for docker
# @var minio_default_publish:example: >
# minio_default_publish:
#   - 127.0.0.1:9000:9000
# @end
minio_default_publish: []

# @var minio_extra_publish:description: List of extra port publishing for docker
# @var minio_extra_publish:example: >
# minio_extra_publish:
#   - 127.0.0.1:9000:9000
# @end
minio_extra_publish: []

# @var minio_default_labels:description: List of default labels to assign to docker
minio_default_labels: []

# @var minio_extra_labels:description: List of extra labels to assign to docker
minio_extra_labels: []

# @var minio_default_volumes:description: List of default volumes to mount for docker
minio_default_volumes:
  - "{{ minio_volume_server }}:/var/lib/minio"

# @var minio_extra_volumes:description: List of extra volumes to mount for docker
# @var minio_extra_volumes:example: >
# minio_extra_volumes:
#   - /path/to/host/folder1:/path/within/container1
#   - /path/to/host/folder2:/path/within/container2
#   - /path/to/host/folder3:/path/within/container3
# @end
minio_extra_volumes: []

# @var minio_memory_limit:description: Memory limit with Docker deployment
# @var minio_memory_limit:example: $ "1024m"
minio_memory_limit:

# @var minio_memory_swap:description: Swap usage with Docker deployment
# @var minio_memory_swap:example: $ "2048m"
minio_memory_swap:

# @var minio_memory_soft_limit:description: Soft memory limit with Docker deployment
# @var minio_memory_soft_limit:example: $ "512m"
minio_memory_soft_limit:

# @var minio_cpu_shares:description: CPU shares with Docker deployment
# @var minio_cpu_shares:example: $ "512"
minio_cpu_shares:

# @var minio_number_of_cpus:description: Number of CPUs with Docker deployment
# @var minio_number_of_cpus:example: $ "1.0"
minio_number_of_cpus:

# @var minio_volume_server:description: Path to server volume
minio_volume_server: /var/lib/minio

# @var minio_domain:description: Domains to access this instance
minio_domain: localhost

# @var minio_access_key:description: For security reasons you should overwrite this value by your own
minio_access_key: 69c353dfb7d5caa1a0f8eaf91f52120dc7f713c9

# @var minio_secret_key:description: For security reasons you should overwrite this value by your own
minio_secret_key: 954cde1f5a3c9b090584e7794ab9a71f9d11d7a1

# @var minio_region:description: Region used within this instance
minio_region: us-east-1

# @var kubectl_arch:description: Architecture for the kubectl release
minio_client_arch: "{{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'amd64' }}"

# @var minio_client_url:description: Download URL for Minio CLI
minio_client_url: "https://dl.minio.io/client/mc/release/linux-{{ minio_client_arch }}/mc"

# @var minio_prometheus_auth_type:description: Auth type for prometheus endpoint
minio_prometheus_auth_type: public

# @var minio_cronjobs:description: List of cronjob definitions for maintenance
# @var minio_cronjobs:example: >
# minio_cronjobs:
#   - name: maintenance
#     minute: '0'
#     hour: '0'
#     day: '*'
#     month: '*'
#     weekday: '*'
#     job: mc rm --older-than 30d --recursive --force bucket/logs
# @end
minio_cronjobs: []

# @var minio_group:description: System group for the Minio service
minio_group: minio

# @var minio_user:description: System user for the Minio service
minio_user: minio

...
